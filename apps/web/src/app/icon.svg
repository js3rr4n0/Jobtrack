<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Deska">
  <!--
    Marca de Deska: el tablero visto de frente. Tres columnas de distinta altura
    dicen lo mismo que el producto, y a 16 px siguen leyendose como tres barras
    en lugar de convertirse en una mancha.
  -->
  <rect width="64" height="64" rx="14" fill="#2563eb" />
  <rect x="14" y="30" width="10" height="20" rx="3" fill="#ffffff" opacity="0.55" />
  <rect x="27" y="22" width="10" height="28" rx="3" fill="#ffffff" opacity="0.78" />
  <rect x="40" y="14" width="10" height="36" rx="3" fill="#ffffff" />
</svg>
