# Despliegue de la API de Deska en Render.
# Importar desde el panel con New -> Blueprint apuntando a este repositorio.
services:
  - type: web
    # El nombre del servicio es la identidad del Blueprint en Render: cambiarlo
    # no renombra el servicio, crea otro y deja huerfano el anterior, con una
    # URL distinta y sin sus variables de entorno. Se mantiene el original a
    # proposito, aunque el producto ya se llame Deska.
    name: jobtrack-api
    runtime: node
    plan: free
    # Render inyecta PORT; la API lo respeta a traves de su configuracion.
    # --include=dev es imprescindible: con NODE_ENV=production npm omitiria las
    # dependencias de desarrollo, entre ellas TypeScript y la CLI de Nest.
    buildCommand: npm install --include=dev && npm run build --workspace apps/api
    startCommand: npm run start:prod --workspace apps/api
    healthCheckPath: /api/health
    envVars:
      # Se fija la version de Node: sin esto Render elige la mas reciente que
      # cumpla el rango de engines, que puede adelantarse a lo que soporta Nest.
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATA_DRIVER
        value: supabase
      # Los valores marcados con sync: false se piden al crear el servicio.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Cuenta que abre el panel de administracion y lee los mensajes de
      # contacto. Sin ella el panel queda cerrado para todos, que es el
      # comportamiento deseado: un panel que se abre por olvidar una variable
      # no es un panel. Debe coincidir con el correo con el que se inicia
      # sesion en Deska.
      - key: ADMIN_EMAIL
        sync: false
